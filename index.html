<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Call Tracker">
<title>Call Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Brand tokens ===== */
  :root {
    --navy: #002864;
    --blue: #2760F0;
    --orange: #F66608;
    --black: #000000;
    --gray: #F2F1F0;
    --muted: #555b68;
    --line: #e2e0dd;
    --tile-border: #d3d7df;
    --transfer: #bdbbb8;
    --radius-tile: 14px;
    --radius-card: 18px;
    color-scheme: light;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--gray);
    color: var(--black);
    min-height: 100vh;
    padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

  /* ===== Header with the brand beam ===== */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--navy); color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 16px;
  }
  header h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 10px; }
  .beam {
    display: block; background: var(--blue); color: #fff;
    border-radius: 999px; padding: 9px 18px;
    font-size: .95rem; font-weight: 500;
  }

  .warn {
    background: var(--orange); color: var(--black);
    font-weight: 600; font-size: .9rem; text-align: center; padding: 10px 16px;
  }

  main { max-width: 560px; margin: 0 auto; padding: 16px; }

  /* ===== Counters (square tiles) ===== */
  .counters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .counter {
    background: #fff; border: 1.5px solid var(--blue); border-radius: var(--radius-tile);
    aspect-ratio: 1 / 0.85; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 8px;
  }
  .counter b { font-size: 2.1rem; font-weight: 800; color: var(--navy); line-height: 1; }
  .counter small { font-size: .8rem; color: var(--muted); margin-top: 6px; font-weight: 500; }

  /* ===== Section headings ===== */
  .section-title { font-size: 1.05rem; font-weight: 700; color: var(--navy); margin: 22px 4px 2px; }
  .section-sub { font-size: .88rem; color: var(--muted); margin: 0 4px 10px; line-height: 1.4; }

  /* ===== Logging tiles (rectangular tiles) ===== */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile {
    text-align: left; background: #fff; color: var(--black);
    border: 1.5px solid var(--tile-border); border-radius: var(--radius-tile);
    padding: 14px; min-height: 74px;
    transition: transform .08s ease, background-color .15s ease;
  }
  .tile:active { transform: scale(.97); }
  .tile .label { display: block; font-size: 1rem; font-weight: 700; }
  .tile .count { display: block; font-size: .85rem; color: var(--muted); margin-top: 4px; }
  .tile.selected { background: var(--blue); border-color: var(--blue); color: #fff; }
  .tile.selected .count { color: rgba(255,255,255,.88); }
  .tile.outcome { border-left: 7px solid var(--c); }
  .tile:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  /* Outcome color coding */
  .o-resolved      { --c: var(--blue); }
  .o-service_visit { --c: var(--navy); }
  .o-transfer      { --c: var(--transfer); }
  .o-escalation    { --c: var(--orange); }

  /* ===== Call type guide ===== */
  .guide { margin: 0 4px 12px; }
  .guide summary { color: var(--blue); font-weight: 600; font-size: .92rem; cursor: pointer; padding: 6px 0; }
  .guide-row { background: #fff; border-radius: 12px; padding: 10px 14px; margin-top: 8px; }
  .guide-row strong { display: block; font-size: .95rem; color: var(--navy); }
  .guide-row span { display: block; font-size: .88rem; color: var(--muted); margin-top: 2px; line-height: 1.4; }

  /* ===== Cards ===== */
  .card { background: #fff; border-radius: var(--radius-card); padding: 18px; margin-top: 16px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .card-head h2 { font-size: 1.1rem; font-weight: 700; color: var(--navy); }
  .card-head span { font-size: .85rem; color: var(--muted); text-align: right; }

  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 0; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row .name { display: flex; align-items: center; gap: 10px; font-weight: 500; }
  .row b { font-weight: 800; font-size: 1.05rem; color: var(--navy); }

  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
  .dot.o-transfer { background: var(--gray); border: 2px solid var(--navy); }

  /* ===== Shift pace ===== */
  .pace-row { margin-top: 12px; }
  .pace-top { display: flex; justify-content: space-between; font-size: .92rem; font-weight: 500; margin-bottom: 6px; }
  .pace-row.now .pace-top span:first-child::after {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--orange); margin-left: 8px; vertical-align: middle;
  }
  .track { height: 10px; background: var(--gray); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; background: var(--blue); border-radius: 999px; transition: width .3s ease; }

  /* ===== Pill buttons (beam shape) ===== */
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .pill {
    background: #fff; color: var(--navy);
    border: 1.5px solid var(--navy); border-radius: 999px;
    padding: 10px 22px; min-height: 44px; font-weight: 600; font-size: .95rem;
  }
  .pill.accent { border-color: var(--orange); color: var(--black); }
  .pill.primary { background: var(--navy); color: #fff; }
  .pill:disabled { opacity: .4; cursor: not-allowed; }
  .wide { display: block; width: 100%; margin-top: 16px; min-height: 50px; font-size: 1rem; }
  .status { font-size: .9rem; color: var(--muted); margin: 14px 4px 0; line-height: 1.45; }

  /* ===== History ===== */
  .day {
    display: block; width: 100%; text-align: left; color: inherit;
    background: #fff; border: none; border-radius: var(--radius-card);
    padding: 16px; margin-bottom: 10px;
  }
  .day:active { transform: scale(.99); }
  .day-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .day-top strong { font-size: 1rem; font-weight: 700; color: var(--navy); }
  .day-top span { font-size: .9rem; color: var(--muted); }
  .mix { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--gray); }
  .seg { display: block; height: 100%; background: var(--c); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: .82rem; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .today-tag {
    display: inline-block; margin-left: 8px; padding: 1px 9px; border-radius: 999px;
    background: var(--blue); color: #fff; font-size: .75rem; font-weight: 600; vertical-align: 2px;
  }
  .empty { text-align: center; color: var(--muted); padding: 48px 20px; line-height: 1.5; }
  .empty strong { display: block; color: var(--navy); font-size: 1.05rem; margin-bottom: 6px; }

  /* ===== Day detail ===== */
  .detail-date { font-size: 1.35rem; font-weight: 800; color: var(--navy); margin: 16px 4px 2px; }
  .log-row { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .93rem; }
  .log-row:last-child { border-bottom: none; }
  .log-row time { color: var(--muted); min-width: 70px; font-variant-numeric: tabular-nums; }

  /* ===== Settings ===== */
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card label { display: block; font-size: .85rem; font-weight: 500; color: var(--muted); }
  input[type="time"], select {
    display: block; width: 100%; margin-top: 6px; min-height: 46px;
    font: inherit; font-size: 1rem; color: var(--black);
    background: #fff; border: 1.5px solid var(--tile-border); border-radius: 12px; padding: 10px 12px;
  }
  .break-row {
    display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .remove {
    min-height: 46px; padding: 0 14px; background: #fff; color: var(--navy);
    border: 1.5px solid var(--tile-border); border-radius: 999px; font-weight: 600; font-size: .9rem;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chip {
    border: 1.5px solid var(--blue); color: var(--navy); border-radius: 999px;
    padding: 6px 12px; font-size: .88rem; font-weight: 600;
  }
  .error {
    background: #fff; border-left: 5px solid var(--orange); border-radius: 10px;
    padding: 11px 14px; margin-top: 12px; font-size: .92rem; font-weight: 500;
  }

  /* ===== Bottom tab bar ===== */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: #fff; border-top: 1px solid var(--line);
    display: flex; justify-content: center; gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  nav.tabs button {
    flex: 1; max-width: 180px; min-height: 46px;
    background: #fff; color: var(--navy);
    border: 1.5px solid var(--navy); border-radius: 999px;
    font-weight: 700; font-size: .95rem;
  }
  nav.tabs button.active { background: var(--navy); color: #fff; }
  nav.tabs button:disabled { opacity: .35; cursor: not-allowed; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>Call Tracker</h1>
  <span class="beam" id="beam"></span>
</header>
<div class="warn" id="warn" hidden>Storage is unavailable in this browser. Calls will be lost when the page closes.</div>

<main id="app"></main>

<nav class="tabs">
  <button data-action="tab" data-id="today">Today</button>
  <button data-action="tab" data-id="history">History</button>
  <button data-action="tab" data-id="settings">Settings</button>
</nav>

<script>
/* =====================================================
   DEFAULTS: the schedule a new user starts from
   ===================================================== */
const DEFAULT_SCHEDULE = {
  start: "08:00",
  end: "16:30",
  breaks: [
    { start: "10:00", len: 15 },
    { start: "12:00", len: 30 },
    { start: "14:00", len: 15 }
  ]
};

const BREAK_LENGTHS = [15, 30, 45, 60];

const CALL_TYPES = [
  { id: "easy_money", icon: "✓",  label: "Easy money",       desc: "Straightforward, predictable issue." },
  { id: "detective",  icon: "?",  label: "Detective case",   desc: "You actually have to troubleshoot." },
  { id: "wild_card",  icon: "!",  label: "Wild card",        desc: "“How did we even get here?”" },
  { id: "therapist",  icon: "♡",  label: "Therapist call",   desc: "40% technical support, 60% emotional support." },
  { id: "reboot",     icon: "↻",  label: "Please reboot it", desc: "Self-explanatory." },
  { id: "boss",       icon: "⚔︎", label: "Boss battle",      desc: "Complicated issue or customer, and you're fighting for your life." },
  { id: "bless",      icon: "★",  label: "Bless you",        desc: "Pleasant customer who restores your faith in humanity." }
];

const OUTCOMES = [
  { id: "resolved",      label: "Resolved" },
  { id: "service_visit", label: "Service Visit" },
  { id: "transfer",      label: "Transfer" },
  { id: "escalation",    label: "Escalation" }
];

/* =====================================================
   STORAGE
   settings:  the user's current schedule
   days:      schedule snapshot per date, saved with the first call
   calls:     one record per call { id, ts, type, outcome }
   ===================================================== */
const STORAGE_KEY = "callTracker";
const SCHEMA_VERSION = 2;
const clone = obj => JSON.parse(JSON.stringify(obj));

let store = {
  version: SCHEMA_VERSION,
  setupDone: false,
  settings: clone(DEFAULT_SCHEDULE),
  days: {},
  calls: []
};
let storageOK = true;

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.calls)) return;

    const oldVersion = parsed.version || 1;
    store.calls = parsed.calls;
    store.settings = parsed.settings || clone(DEFAULT_SCHEDULE);
    store.days = parsed.days || {};
    store.setupDone = typeof parsed.setupDone === "boolean" ? parsed.setupDone : parsed.calls.length > 0;

    // Version 1 used one fixed schedule: snapshot it onto every existing day
    if (oldVersion < 2) {
      parsed.calls.forEach(c => {
        const k = dayKey(new Date(c.ts));
        if (!store.days[k]) store.days[k] = clone(DEFAULT_SCHEDULE);
      });
      save();
    }
  } catch (e) {
    storageOK = false;
  }
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    storageOK = true;
  } catch (e) {
    storageOK = false;
  }
}

/* =====================================================
   HELPERS
   ===================================================== */
const pad = n => String(n).padStart(2, "0");
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const toMin = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };

// Local calendar day, e.g. "2026-10-01"
function dayKey(date) {
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}
const todayKey = () => dayKey(new Date());

function callsFor(key) {
  return store.calls
    .filter(c => dayKey(new Date(c.ts)) === key)
    .sort((a, b) => a.ts.localeCompare(b.ts));
}

function tally(calls, field) {
  return calls.reduce((acc, c) => { acc[c[field]] = (acc[c[field]] || 0) + 1; return acc; }, {});
}

const typeLabel = id => (CALL_TYPES.find(t => t.id === id) || { label: id }).label;
const outcomeLabel = id => (OUTCOMES.find(o => o.id === id) || { label: id }).label;
const fmtTime = iso => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

function fmtDate(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
}

// 510 -> "8:30 AM"
function fmtClock(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return `${h % 12 || 12}:${pad(m)} ${h >= 12 ? "PM" : "AM"}`;
}

// 480 -> "8", 615 -> "10:15"
function fmtShort(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return `${h % 12 || 12}${m ? ":" + pad(m) : ""}`;
}

const shiftLabel = sched => `${fmtClock(toMin(sched.start))} to ${fmtClock(toMin(sched.end))}`;

/* =====================================================
   SCHEDULE LOGIC
   ===================================================== */

// The schedule a day was logged under (falls back to current settings)
const scheduleFor = key => store.days[key] || store.settings;

// Slice the shift at each clock hour, then cut every break out of the windows
function buildBuckets(sched) {
  const s = toMin(sched.start), e = toMin(sched.end);

  const cuts = [s];
  for (let h = Math.floor(s / 60) * 60 + 60; h < e; h += 60) cuts.push(h);
  cuts.push(e);

  const breaks = sched.breaks
    .filter(b => b.start)
    .map(b => [toMin(b.start), toMin(b.start) + b.len])
    .sort((a, b) => a[0] - b[0]);

  const buckets = [];
  for (let i = 0; i < cuts.length - 1; i++) {
    let pieces = [[cuts[i], cuts[i + 1]]];
    breaks.forEach(([bs, be]) => {
      pieces = pieces.flatMap(([ps, pe]) => {
        if (be <= ps || bs >= pe) return [[ps, pe]];   // break doesn't touch this piece
        const kept = [];
        if (bs > ps) kept.push([ps, bs]);              // part before the break
        if (be < pe) kept.push([be, pe]);              // part after the break
        return kept;
      });
    });
    pieces.forEach(([a, b]) => buckets.push({ start: a, end: b, label: `${fmtShort(a)}–${fmtShort(b)}` }));
  }

  return buckets.length ? buckets : [{ start: s, end: e, label: `${fmtShort(s)}–${fmtShort(e)}` }];
}

// Latest window that has started; calls during a break count toward the window that just ended
function bucketIndex(date, buckets) {
  const m = date.getHours() * 60 + date.getMinutes();
  let idx = 0;
  buckets.forEach((b, i) => { if (m >= b.start) idx = i; });
  return idx;
}

function validate(d) {
  const errors = [];
  if (!d.start || !d.end) return ["Enter a shift start and end time."];

  const s = toMin(d.start), e = toMin(d.end);
  if (e <= s) errors.push("Shift end must be after shift start.");
  if (d.breaks.some(b => !b.start)) errors.push("Each break needs a start time.");

  const ranges = d.breaks
    .filter(b => b.start)
    .map(b => [toMin(b.start), toMin(b.start) + b.len])
    .sort((a, b) => a[0] - b[0]);

  if (e > s && ranges.some(([bs, be]) => bs < s || be > e)) {
    errors.push("Each break must fall within your shift.");
  }
  for (let i = 1; i < ranges.length; i++) {
    if (ranges[i][0] < ranges[i - 1][1]) {
      errors.push("Two breaks overlap. Adjust one of them.");
      break;
    }
  }
  return errors;
}

/* =====================================================
   SHARED VIEW PIECES
   ===================================================== */
function counters(total, byOutcome) {
  return `
    <div class="counters">
      <div class="counter"><b>${total}</b><small>Calls</small></div>
      <div class="counter"><b>${byOutcome.service_visit || 0}</b><small>Service visits</small></div>
      <div class="counter"><b>${byOutcome.transfer || 0}</b><small>Transfers</small></div>
    </div>`;
}

function outcomeRows(byOutcome) {
  return OUTCOMES.map(o => `
    <div class="row">
      <span class="name"><i class="dot o-${o.id}"></i>${o.label}</span>
      <b>${byOutcome[o.id] || 0}</b>
    </div>`).join("");
}

function typeRows(byType) {
  return CALL_TYPES.map(t => `
    <div class="row">
      <span class="name">${t.icon} ${t.label}</span>
      <b>${byType[t.id] || 0}</b>
    </div>`).join("");
}

function guide(open, where) {
  return `
    <details class="guide" data-where="${where}"${open ? " open" : ""}>
      <summary>What do these call types mean?</summary>
      ${CALL_TYPES.map(t => `
        <div class="guide-row"><strong>${t.icon} ${t.label}</strong><span>${t.desc}</span></div>`).join("")}
    </details>`;
}

function paceCard(calls, isToday, sched) {
  const buckets = buildBuckets(sched);
  const counts = buckets.map(() => 0);
  calls.forEach(c => counts[bucketIndex(new Date(c.ts), buckets)]++);
  const max = Math.max(1, ...counts);

  let nowIdx = -1;
  if (isToday) {
    const now = new Date();
    const m = now.getHours() * 60 + now.getMinutes();
    if (m >= toMin(sched.start) && m < toMin(sched.end)) nowIdx = bucketIndex(now, buckets);
  }

  return `
    <section class="card">
      <div class="card-head"><h2>Shift pace</h2><span>${shiftLabel(sched)}</span></div>
      ${buckets.map((b, i) => `
        <div class="pace-row${i === nowIdx ? " now" : ""}">
          <div class="pace-top"><span>${b.label}</span><span>${plural(counts[i], "call")}</span></div>
          <div class="track"><div class="fill" style="width:${(counts[i] / max) * 100}%"></div></div>
        </div>`).join("")}
    </section>`;
}

function mixBar(byOutcome, total) {
  return `<span class="mix">${OUTCOMES.map(o => {
    const n = byOutcome[o.id] || 0;
    return n ? `<span class="seg o-${o.id}" style="width:${(n / total) * 100}%"></span>` : "";
  }).join("")}</span>`;
}

/* =====================================================
   VIEW STATE
   ===================================================== */
let view = "today";         // "today" | "history" | "day" | "settings"
let selectedType = null;    // call type picked in step 1
let detailKey = null;       // day shown in Day detail
let settingsDraft = null;   // unsaved edits on the Settings screen
let guideOpen = false;      // keeps the guide open across re-renders

/* =====================================================
   VIEWS
   ===================================================== */
function renderToday() {
  const key = todayKey();
  const calls = callsFor(key);
  const byOutcome = tally(calls, "outcome");
  const byType = tally(calls, "type");
  const sel = CALL_TYPES.find(t => t.id === selectedType);
  const last = calls[calls.length - 1];

  return `
    ${counters(calls.length, byOutcome)}

    <h3 class="section-title">1. What kind of call was it?</h3>
    <p class="section-sub">Tap the call type first.</p>
    ${guide(guideOpen, "today")}
    <div class="grid">
      ${CALL_TYPES.map(t => `
        <button class="tile${t.id === selectedType ? " selected" : ""}" data-action="type" data-id="${t.id}" aria-pressed="${t.id === selectedType}">
          <span class="label">${t.icon} ${t.label}</span>
          <span class="count">${plural(byType[t.id] || 0, "call")}</span>
        </button>`).join("")}
    </div>

    <h3 class="section-title">2. How did it end?</h3>
    <p class="section-sub">${sel ? `Logging a ${sel.label} call.` : "Unlocks after you pick a call type."}</p>
    <div class="grid">
      ${OUTCOMES.map(o => `
        <button class="tile outcome o-${o.id}" data-action="outcome" data-id="${o.id}"${sel ? "" : " disabled"}>
          <span class="label">${o.label}</span>
          <span class="count">${plural(byOutcome[o.id] || 0, "call")}</span>
        </button>`).join("")}
    </div>

    <section class="card">
      <div class="card-head"><h2>Today's breakdown</h2><span>${sel ? "Pick an outcome" : "Ready for next call"}</span></div>
      ${outcomeRows(byOutcome)}
    </section>

    ${paceCard(calls, true, scheduleFor(key))}

    <div class="actions">
      <button class="pill accent" data-action="undo"${calls.length ? "" : " disabled"}>Undo last</button>
      <button class="pill" data-action="reset"${calls.length ? "" : " disabled"}>Reset day</button>
    </div>
    <p class="status">${last
      ? `${plural(calls.length, "call")} logged today. Last one: ${typeLabel(last.type)}, ended in ${outcomeLabel(last.outcome)} at ${fmtTime(last.ts)}.`
      : "No calls logged yet today."}</p>`;
}

function renderHistory() {
  const keys = [...new Set(store.calls.map(c => dayKey(new Date(c.ts))))].sort().reverse();
  if (!keys.length) {
    return `<div class="empty"><strong>No shifts logged yet</strong>Log calls on the Today tab and each shift will appear here.</div>`;
  }
  const today = todayKey();

  return `
    <h3 class="section-title">Your shifts</h3>
    <p class="section-sub">Tap a day to see its full breakdown.</p>
    ${keys.map(k => {
      const calls = callsFor(k);
      const byOutcome = tally(calls, "outcome");
      return `
        <button class="day" data-action="day" data-id="${k}">
          <span class="day-top">
            <strong>${fmtDate(k)}${k === today ? '<span class="today-tag">Today</span>' : ""}</strong>
            <span>${plural(calls.length, "call")}</span>
          </span>
          ${mixBar(byOutcome, calls.length)}
          <span class="legend">
            ${OUTCOMES.filter(o => byOutcome[o.id]).map(o => `
              <span><i class="dot o-${o.id}"></i>${o.label} ${byOutcome[o.id]}</span>`).join("")}
          </span>
        </button>`;
    }).join("")}`;
}

function renderDay(key) {
  const calls = callsFor(key);
  const byOutcome = tally(calls, "outcome");
  const byType = tally(calls, "type");

  return `
    <button class="pill" data-action="back">Back to history</button>
    <h3 class="detail-date">${fmtDate(key)}</h3>
    <p class="section-sub">${plural(calls.length, "call")} logged</p>

    ${counters(calls.length, byOutcome)}

    <section class="card">
      <div class="card-head"><h2>Outcomes</h2></div>
      ${outcomeRows(byOutcome)}
    </section>

    <section class="card">
      <div class="card-head"><h2>Call types</h2></div>
      ${typeRows(byType)}
    </section>

    ${paceCard(calls, false, scheduleFor(key))}

    <section class="card">
      <div class="card-head"><h2>Call log</h2><span>In order logged</span></div>
      ${calls.length
        ? calls.map(c => `
          <div class="log-row">
            <time>${fmtTime(c.ts)}</time>
            <span><strong>${typeLabel(c.type)}</strong>, ended in ${outcomeLabel(c.outcome)}</span>
          </div>`).join("")
        : '<p class="section-sub">No calls on this day.</p>'}
    </section>`;
}

function renderSettings() {
  if (!settingsDraft) settingsDraft = clone(store.settings);
  const d = settingsDraft;
  const firstRun = !store.setupDone;

  return `
    <h3 class="detail-date">${firstRun ? "Set up your shift" : "Your schedule"}</h3>
    <p class="section-sub">${firstRun
      ? "Check your shift and breaks, then save. You can change them anytime in Settings."
      : "Changes apply to today and future shifts. Past days keep the schedule they were logged under."}</p>

    <section class="card">
      <div class="card-head"><h2>Shift</h2></div>
      <div class="field-row">
        <label>Start<input type="time" data-field="start" value="${d.start}"></label>
        <label>End<input type="time" data-field="end" value="${d.end}"></label>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>Breaks</h2><span>${plural(d.breaks.length, "break")}</span></div>
      ${d.breaks.length
        ? d.breaks.map((b, i) => `
          <div class="break-row">
            <label>Starts<input type="time" data-field="break-start" data-index="${i}" value="${b.start}"></label>
            <label>Length
              <select data-field="break-len" data-index="${i}">
                ${BREAK_LENGTHS.map(n => `<option value="${n}"${n === b.len ? " selected" : ""}>${n} min</option>`).join("")}
              </select>
            </label>
            <button class="remove" data-action="remove-break" data-index="${i}" aria-label="Remove break ${i + 1}">Remove</button>
          </div>`).join("")
        : '<p class="section-sub">No breaks added.</p>'}
      <div class="actions"><button class="pill" data-action="add-break">Add break</button></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>Shift pace preview</h2><span id="preview-count"></span></div>
      <div id="preview" class="chips"></div>
    </section>

    <div id="errors" role="alert"></div>
    <button class="pill primary wide" id="save" data-action="save-settings">Save schedule</button>

    ${firstRun ? `
      <h3 class="section-title">Call type guide</h3>
      <p class="section-sub">Everyone uses the same seven types, so read these once before your first call.</p>
      ${guide(true, "setup")}` : ""}`;
}

// Updates preview, errors, and Save without re-rendering the inputs
function updatePreview() {
  const preview = document.getElementById("preview");
  if (!preview || !settingsDraft) return;

  const errors = validate(settingsDraft);
  document.getElementById("errors").innerHTML = errors.map(m => `<p class="error">${m}</p>`).join("");
  document.getElementById("save").disabled = errors.length > 0;

  const count = document.getElementById("preview-count");
  if (errors.length) {
    preview.innerHTML = '<span class="section-sub">Fix the issue below to see your pace windows.</span>';
    count.textContent = "";
    return;
  }
  const buckets = buildBuckets(settingsDraft);
  preview.innerHTML = buckets.map(b => `<span class="chip">${b.label}</span>`).join("");
  count.textContent = plural(buckets.length, "window");
}

function render() {
  if (!store.setupDone) view = "settings";
  if (view === "day" && !detailKey) view = "history";
  if (view !== "settings") settingsDraft = null;

  document.getElementById("app").innerHTML =
    view === "today" ? renderToday() :
    view === "history" ? renderHistory() :
    view === "day" ? renderDay(detailKey) :
    renderSettings();

  const t = todayKey();
  document.getElementById("beam").textContent =
    view === "today" ? `${fmtDate(t)}, ${shiftLabel(scheduleFor(t))}` :
    view === "history" ? "Shift history" :
    view === "day" ? "Day detail" :
    store.setupDone ? "Shift settings" : "First-time setup";

  const activeTab = view === "day" ? "history" : view;
  document.querySelectorAll("nav.tabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.id === activeTab);
    b.disabled = !store.setupDone && b.dataset.id !== "settings";
  });

  document.getElementById("warn").hidden = storageOK;
  if (view === "settings") updatePreview();
}

/* =====================================================
   EVENTS
   ===================================================== */

// Buttons: one listener routes everything by data-action
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const { action, id } = el.dataset;

  switch (action) {
    case "type":
      selectedType = selectedType === id ? null : id;
      break;

    case "outcome": {
      if (!selectedType) return;
      const t = todayKey();
      if (!store.days[t]) store.days[t] = clone(store.settings);   // snapshot on first call
      store.calls.push({
        id: `c_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        ts: new Date().toISOString(),
        type: selectedType,
        outcome: id
      });
      selectedType = null;
      save();
      break;
    }

    case "undo": {
      const today = callsFor(todayKey());
      const last = today[today.length - 1];
      if (last) {
        store.calls = store.calls.filter(c => c.id !== last.id);
        save();
      }
      break;
    }

    case "reset":
      if (confirm("Clear every call logged today? This can't be undone.")) {
        const t = todayKey();
        store.calls = store.calls.filter(c => dayKey(new Date(c.ts)) !== t);
        delete store.days[t];
        selectedType = null;
        save();
      }
      break;

    case "add-break":
      settingsDraft.breaks.push({ start: "12:00", len: 15 });
      break;

    case "remove-break":
      settingsDraft.breaks.splice(Number(el.dataset.index), 1);
      break;

    case "save-settings": {
      if (validate(settingsDraft).length) return;
      const next = clone(settingsDraft);
      next.breaks.sort((a, b) => toMin(a.start) - toMin(b.start));
      store.settings = next;
      const t = todayKey();
      if (store.days[t]) store.days[t] = clone(next);   // today follows the new schedule
      store.setupDone = true;
      settingsDraft = null;
      view = "today";
      save();
      window.scrollTo(0, 0);
      break;
    }

    case "tab":
      view = id;
      detailKey = null;
      settingsDraft = null;
      window.scrollTo(0, 0);
      break;

    case "day":
      view = "day";
      detailKey = id;
      window.scrollTo(0, 0);
      break;

    case "back":
      view = "history";
      detailKey = null;
      window.scrollTo(0, 0);
      break;
  }
  render();
});

// Settings inputs: update the draft and the preview only
function onField(e) {
  const el = e.target;
  const field = el.dataset && el.dataset.field;
  if (!field || !settingsDraft) return;
  const i = Number(el.dataset.index);

  if (field === "start") settingsDraft.start = el.value;
  else if (field === "end") settingsDraft.end = el.value;
  else if (field === "break-start") settingsDraft.breaks[i].start = el.value;
  else if (field === "break-len") settingsDraft.breaks[i].len = Number(el.value);

  updatePreview();
}
document.addEventListener("input", onField);
document.addEventListener("change", onField);

// Remember whether the guide on Today is open
document.addEventListener("toggle", e => {
  if (e.target.matches && e.target.matches('details.guide[data-where="today"]')) guideOpen = e.target.open;
}, true);

// Keep the "now" marker and the date current
setInterval(() => { if (view === "today") render(); }, 60000);

load();
view = store.setupDone ? "today" : "settings";
render();
</script>
</body>
</html>
